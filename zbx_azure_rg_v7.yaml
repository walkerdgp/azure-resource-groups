      description: Janela metrica (min)
    - macro: '{$AZURE_DISCOVERY_INTERVAL}'
      value: 1h
      description: Intervalo LLD
    - macro: '{$AZURE_HISTORY}'
      value: 7d
      description: Retencao historico
    - macro: '{$AZURE_TRENDS}'
