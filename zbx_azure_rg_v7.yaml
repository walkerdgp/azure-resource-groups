    - macro: '{$AZURE_SUBSCRIPTION_ID}'
      value: ''
      description: Azure Subscription ID
    - macro: '{$AZURE_RESOURCE_GROUP}'
      value: ''
      description: Nome do Resource Group
    - macro: '{$AZURE_TENANT_ID}'
      value: ''
      description: Tenant ID (AAD)
    - macro: '{$AZURE_CLIENT_ID}'
      value: ''
      description: Service Principal Client ID
    - macro: '{$AZURE_CLIENT_SECRET}'
      value: ''
      type: SECRET_TEXT
      description: Service Principal Client Secret
    - macro: '{$AZURE_TAG_INCLUDE_NAME}'
      value: ''
      description: Tag de inclusao (vazio = todos)
    - macro: '{$AZURE_TAG_INCLUDE_VALUE}'
      value: 'true'
      description: Valor da tag de inclusao
    - macro: '{$AZURE_TAG_EXCLUDE_NAME}'
      value: zabbix-skip
      description: Tag de exclusao
    - macro: '{$AZURE_TAG_EXCLUDE_VALUE}'
