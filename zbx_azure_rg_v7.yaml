    discovery_rules:
    - uuid: cfa9fd8426e54138b59eb3ab9d07c71b
      name: Azure Virtual Machine Discovery
      type: EXTERNAL
      key: azure_discovery.sh[vm,{$AZURE_RESOURCE_GROUP},{$AZURE_SUBSCRIPTION_ID},{$AZURE_TAG_INCLUDE_NAME},{$AZURE_TAG_INCLUDE_VALUE},{$AZURE_TAG_EXCLUDE_NAME},{$AZURE_TAG_EXCLUDE_VALUE}]
      delay: '{$AZURE_DISCOVERY_INTERVAL}'
      lifetime: 30d
      enabled_lifetime: 3d
      description: Descobre recursos Virtual Machine no Resource Group.
      item_prototypes:
      - uuid: 1eaf61e1589c4edc872b17479d82c8f1
        name: 'Virtual Machine {{#RESOURCE_NAME}}: raw metrics JSON'
        type: EXTERNAL
        key: azure_get_metrics.sh["{#RESOURCE_ID}",{#RESOURCE_TYPE_SHORT},{$AZURE_METRIC_INTERVAL},"vm"]
        delay: '{$AZURE_POLL_INTERVAL}'
        value_type: TEXT
        history: 1d
        description: Coleta batch de metricas via Azure CLI.
        preprocessing:
        - type: CHECK_JSON_ERROR
          parameters:
          - $.error
        tags:
        - tag: component
          value: vm
        - tag: target
          value: master
      - uuid: 21513969ef7a4e02a0fa7396dfc4c99a
        name: 'Virtual Machine {{#RESOURCE_NAME}}: Percentage CPU'
        type: DEPENDENT
        key: azure.vm.percentage_cpu[{{#RESOURCE_ID}}]
        delay: '0'
        history: '{$AZURE_HISTORY}'
        trends: '{$AZURE_TRENDS}'
        value_type: FLOAT
        units: '%'
        description: CPU
        master_item:
          key: azure_get_metrics.sh["{#RESOURCE_ID}",{#RESOURCE_TYPE_SHORT},{$AZURE_METRIC_INTERVAL},"vm"]
        preprocessing:
        - type: JSONPATH
          parameters:
          - $['Percentage CPU']
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        tags:
        - tag: component
          value: vm
        - tag: metric
          value: Percentage CPU
      - uuid: 3a74584f4b74430c986bf9a06b26fcb1
        name: 'Virtual Machine {{#RESOURCE_NAME}}: Available Memory Bytes'
