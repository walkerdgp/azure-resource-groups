    template: Azure Resource Group Monitor
    name: Azure Resource Group Monitor
    description: |-
      Azure Resource Group Monitor — Zabbix 7.0 LTS
      28 discovery rules / 256 items / 130 triggers

      Scripts: /usr/lib/zabbix/externalscripts/
      Config:  /etc/zabbix/azure.conf
    vendor:
      name: InfraTI
      version: '7.0'
